[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "WideLittleCart"
versionNumber = "1.0.0"
description = "Makes the vanilla POCKET C.A.R.T. as wide as the normal C.A.R.T. and twice as deep. Colliders, in-cart detection, handle and push distance scale too. Host-controlled size."
websiteUrl = "https://github.com/ben-hough/repo-wide-little-cart"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-WideLittleCart"

[[build.copy]]
source = "MrGlim.WideLittleCart.dll"
target = "MrGlim.WideLittleCart.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["mods", "items", "ai-generated"]
